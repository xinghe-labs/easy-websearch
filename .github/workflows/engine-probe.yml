name: engine-probe

# Baseline engines are scraped HTML — they can break when the engine changes
# markup or tightens anti-bot rules. Probe weekly; open an issue on failure
# so breakage is caught before users hit it.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571 # v4
        with:
          node-version: 20
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.12"
      - name: Probe baseline engines (both runtimes)
        id: probe
        continue-on-error: true
        run: |
          set -u
          RUNNERS=("node scripts/search.mjs" "python3 scripts/search.py")
          for runner in "${RUNNERS[@]}"; do
            if ! $runner "open source" -n 3 --json > /dev/null 2>&1; then
              echo "status=failed for runner: $runner" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done
          echo "status=ok" >> "$GITHUB_OUTPUT"
      - name: Open issue on engine failure
        if: steps.probe.outcome == 'failure'
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const day = new Date().toISOString().slice(0, 10);
            const title = `engine-probe failed (${day})`;
            const body = [
              `Weekly probe reported: **${process.env.PROBE_STATUS}**.`,
              '',
              'Baseline engine markup or anti-bot rules likely changed.',
              'Re-run `tests/e2e.sh` locally and check',
              '`references/engine-notes.md`, then patch the affected parser.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['ci', 'engines'],
            });
