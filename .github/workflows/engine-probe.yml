name: engine-probe

# Baseline engines are scraped HTML — they can break when the engine changes
# markup or tightens anti-bot rules. Probe weekly; open an issue on failure
# so breakage is caught before users hit it.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe baseline engines (both runtimes)
        id: probe
        continue-on-error: true
        run: |
          set -u
          STATUS=ok
          for runner in "node scripts/search.mjs" "python3 scripts/search.py"; do
            if ! $runner "open source" -n 3 --json > /dev/null 2>&1; then
              STATUS="failed for runner: $runner"
            fi
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "ok" ]
      - name: Open issue on engine failure
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `engine-probe failed (${new Date().toISOString().slice(0, 10)})`,
              body: `Weekly probe reported: **${{ steps.probe.outputs.status }}**.\n\nBaseline engine markup or anti-bot rules likely changed. Re-run \\\`tests/e2e.sh\\\` locally, check \\\`references/engine-notes.md\\\`, and patch the affected parser.`,
              labels: ["ci", "engines"],
            });
